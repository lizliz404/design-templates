,"_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"category":"","date":"2026-10-06","excludeFromSearch":false,"image":{"_type":"imageWithMeta","asset":{"_id":"image-ba1e81fce684d896ea9e0ed0c9375b8d62468e00-1920x1080-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7777777777777777,"height":1080,"width":1920},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","excludeLLM":false},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"N1G5rtOZj8187JlhVNj8ZV","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"U0oN0QIqDw3OWy2Rvws2n8"}},"_type":"page","_updatedAt":"2026-10-06T20:13:24Z","category":"company","meta":{"description":"The latest news, announcements, and insights from Anduril Industries.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"deba6017-6ea9-492e-a4f6-78f295f14d6a","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"slices":[{"_key":"c6fbc45ae09f","_type":"oneColumnRichText","content":[{"_key":"cfe7d09b5dcd","_type":"block","children":[{"_key":"779faa151fe1","_type":"span","marks":["strong","em"],"text":"Arsenal-2 Will Increase Production Capacity for Virginia-Class Submarine Program\n"},{"_key":"633296adc428","_type":"span","marks":[],"text":"President Donald J. Trump today announced Arsenal-2, a new software-defined shipyard backed by a $3.7 billion private capital investment by Anduril Industries. The facility will manufacture critical components for the Virginia-class submarine, adding significant new capacity to America's submarine industrial base in support of the Navy's effort to increase attack submarine production.\n\nUnder President Trump’s leadership, the U.S. Navy has awarded Anduril a contract of up to $2.9 billion, with payments tied directly to demonstrated production outcomes. This contract structure ensures that Anduril, not the taxpayer, takes on the majority of the execution risk, aligning incentives to ensure on-time, high-quality submarine production. Altogether, this equates to a $6.6 billion investment in America’s submarine industrial base.\n\nVirginia-class submarines are built by General Dynamics Electric Boat and Huntington Ingalls Industries’ Newport News Shipbuilding as part of one of the most complex manufacturing enterprises in the country. Meeting domestic fleet requirements and AUKUS commitments will require substantial growth across that enterprise, including new suppliers, infrastructure, workforce, and production capacity. Arsenal-2 is intended to contribute to that expansion.\n\nArsenal-2 will build complex components and large scale assemblies of the Virginia-class submarine and deliver them to Electric Boat and Newport News Shipbuilding for final assembly. Adding another source of this work will allow more submarine construction to happen in parallel across the industrial base and increase the overall capacity available to the Virginia-class program.\n\n"},{"_key":"455a1d9496a2","_type":"span","marks":["strong","strong"],"text":"Building Arsenal-2 in Baltimore County"},{"_key":"022f94c3ca83","_type":"span","marks":[],"text":"\nThe scale of the production plan is reflected in the physical infrastructure and workforce required for its execution. Arsenal-2 will be built at Tradepoint Atlantic in Baltimore County, Maryland, where the project will create 3,100 direct jobs and support more than 11,000 indirect jobs. The site will drive $2 billion in annual economic output, including an estimated $312 million in wages each year.\n\nPermitting and site preparation will begin immediately, with construction commencing as soon as the necessary approvals are in place. Initial operations are expected to come online in 2030, with production scaling progressively thereafter as Anduril builds the workforce, supplier base, infrastructure, and manufacturing throughput required for submarine production.\n\nArsenal-2 will sit within the Sparrows Point complex, a site central to America's maritime heritage and well positioned for a new generation of heavy industry. Existing road, rail, and maritime infrastructure connect the site to suppliers and to the nation's two primary submarine builders. Baltimore's shipyards produced the first Liberty Ship during World War II, and Sparrows Point was once known as the 'Patriarch of U.S. Tanker Builders.'; Arsenal-2 will return shipbuilding to a site that once helped define American naval power.\n\n"},{"_key":"64bf1605867a","_type":"span","marks":["strong","strong"],"text":"A Shipyard Designed for Production"},{"_key":"0b41bb254e61","_type":"span","marks":[],"text":"\nArsenal-2 is designed as a product in its own right: a modern shipbuilding system built around software-defined production and advanced manufacturing. At more than 2 million square feet — roughly 40 football fields — the facility will be purpose-built on a 187-acre site for high-volume, high-precision production of undersea naval capabilities.\n\nThe shipyard's layout is optimized for production. Reduced distances between fabrication, assembly, testing, and integration areas eliminate the staging bottlenecks that slow conventional yards. A functional 1,200-foot graving dock and multimodal road and rail access support large-scale component movement. High-bay assembly halls, adjacent fabrication areas, and reconfigurable production lines allow the yard to shift rapidly as Navy requirements evolve.\n\nArsenalOS, Anduril's industrial software platform, will provide the digital backbone for the yard and its production systems. It will connect fabrication workflows, outfitting sequences, material movement, inspection protocols, and documentation requirements in a single system, giving workers and managers real-time visibility into the state of production. Digital work instructions, embedded quality controls, modern sensing, and automation will support the expertise of welders, pipefitters, electricians, shipfitters, inspectors, and other skilled trades. By making production requirements more visible and processes more consistent, ArsenalOS will help new workers train faster while preserving the technical rigor, judgment, and quality required for submarine construction.\n\n"},{"_key":"8cc57a95f36a","_type":"span","marks":["strong"],"text":"Building the Industrial Foundation"},{"_key":"626451848999","_type":"span","marks":[],"text":"\nIn parallel with Arsenal-2's construction, Anduril is already standing up the manufacturing capabilities that will anchor operations at the new yard. Anduril will manufacture critical Virginia-class submarine components at a new 160,000-square-foot facility in Orange County, California, purpose-built to support key submarine construction processes and SUBSAFE-qualified production qualification efforts.\n\nThe Orange County facility gives Anduril a two-year operational head start to develop and validate manufacturing methods, production workflows, and quality systems before Arsenal-2 comes online. It will support prototyping and production of Virginia-class test assets and critical maritime components, including torpedo tubes, while allowing Anduril to recruit and train the early workforce on the systems and standards that will ultimately scale at Arsenal-2. Once Arsenal-2 comes online, the Orange County facility will continue supporting broader maritime manufacturing efforts across Anduril's industrial network.\n\nThis is the same approach Anduril has used at Arsenal-1 in Ohio: building the workforce, processes, and production system ahead of full-scale operations.\n\n"},{"_key":"06a0d73b7035","_type":"span","marks":["strong"],"text":"A Distributed Industrial Network"},{"_key":"a9553b6296f9","_type":"span","marks":[],"text":"\nArsenal-2 is also part of a broader network of Anduril production facilities spanning the United States and allied nations — including Arsenal-1 in the Columbus, Ohio region; its maritime factory at Quonset Point, Rhode Island; its Ghost Shark factory in Sydney, Australia; a rocket motor facility in McHenry, Mississippi; and more than 15 additional production sites. Together, these facilities form a distributed industrial network designed to rapidly scale production of the systems, components, and infrastructure required for modern defense.\n\nClosing the gap between current Virginia-class output and the Navy’s requirement will require expansion across the submarine industrial base. By investing private capital in additional shipbuilding infrastructure, proving out its production system years before Arsenal-2 opens, and accepting a contract structure tied to measurable outcomes, Anduril is adding capacity to an existing national enterprise and helping create the industrial scale required to increase Virginia-class production.\n\nFor a deeper dive on how Anduril is refitting America’s fleet, visit "},{"_key":"15306a8b1f0c","_type":"span","marks":["5cb83c24dc1f"],"text":"Anduril.com/shipyard"},{"_key":"a0bc3dfd133e","_type":"span","marks":[],"text":".\n\n———\n\n"},{"_key":"771ac9f72fb5","_type":"span","marks":["strong"],"text":"Quotes on Arsenal-2\nU.S. SENATE"}],"markDefs":[{"_key":"5cb83c24dc1f","_type":"link","href":"http://Anduril.com/shipyard"}],"style":"normal"},{"_key":"49455fe10f23","_type":"block","children":[{"_key":"6c93b261a45d","_type":"span","marks":["strong"],"text":"Senator Angela Alsobrooks, MD:"},{"_key":"db84afe541ca","_type":"span","marks":[],"text":"\n“This $3.7 billion investment is indication once again of the strength of Baltimore, and the impact Baltimore has on our entire state and country. Maryland continues to be at the forefront of technology, innovation, and advancing our national security goals. This investment will be a huge economic boost to our region – adding 14,000 total jobs – and it will support the Navy’s efforts to increase production and advance their submarine technology.\"\n\n"},{"_key":"f5f0d9d227ff","_type":"span","marks":["strong"],"text":"U.S. House of Representatives"},{"_key":"64eedf01b4bf","_type":"span","marks":[],"text":"\n"},{"_key":"427b4cae0c30","_type":"span","marks":["strong"],"text":"Congressman Johnny Olszewski, MD-02:"},{"_key":"1b9d6a3467a9","_type":"span","marks":[],"text":"\n\"Every family deserves the dignity that comes with a good paycheck, and this project will help deliver that promise to thousands of Marylanders. As someone whose roots run deep in Sparrows Point, I know what this historic site has meant to generations of Marylanders and what it means to see good jobs and advanced manufacturing return to this community. Not only does this project strengthen our economic and national security — it also gives us a chance to write the next chapter of Sparrows Point's storied industrial legacy. I'm proud to welcome this investment to Baltimore County and excited about what it will mean for workers, families, and our entire region.“\n\n"},{"_key":"8f4032f4ebde","_type":"span","marks":["strong"],"text":"Congresswoman Sarah Elfreth, MD-03"},{"_key":"a57e2601fa80","_type":"span","marks":[],"text":"\n\"By bringing over 13,000 jobs to the Baltimore region, we are once again investing in Maryland's long and storied history of shipbuilding and maritime manufacturing. I am glad to see this critical combination of private sector and government investment to support our economy, strengthen our national security, and revitalize key industries. Sparrows Point built the first Liberty Ship in WWII, and it is only fitting that the same site will now produce critical components for modern submarines. I will continue to fight for additional investment at Coast Guard Yard Baltimore and the redevelopment of Curtis Creek to complement these investments as we take inspiration from what once was to build a bright and successful future for Maryland's maritime industry.“\n\n"},{"_key":"f7a5434afe03","_type":"span","marks":["strong"],"text":"Congressman Steny H. Hoyer, MD-05:"},{"_key":"54fb8291581f","_type":"span","marks":[],"text":"\n\"This is an exciting announcement for Maryland, and the benefits of this investment and partnership will be felt not only in the greater Baltimore area but all across our state. Much of the future of defense technology centers on out-innovating our adversaries on autonomous and uncrewed vehicles at sea and in the air, and Maryland is already emerging as a leader in this field, thanks to the work we've done in Southern Maryland around Pax River as well as partnerships with educational institutions like the College of Southern Maryland. I thank Anduril for recognizing this leadership and for seizing this opportunity to create good jobs in our state and advance our national security.“\n\n"},{"_key":"4ebf96b4180a","_type":"span","marks":["strong"],"text":"Congressman Andy Harris, MD-01:"},{"_key":"f9b1939b066a","_type":"span","marks":[],"text":"\n\"Thanks to the One Big Beautiful Bill, which laid the groundwork for efforts like this to expand our defense industrial base in Maryland, adding thousands of good-paying jobs in the state while providing the best weaponry possible for our men and women in uniform.\"\n"}],"markDefs":[],"style":"normal"},{"_key":"09dd724bcf7b","_type":"block","children":[{"_key":"2ef7b440cf5a","_type":"span","marks":["strong"],"text":"State of Maryland — Executive"}],"markDefs":[],"style":"normal"},{"_key":"fc4064db1452","_type":"block","children":[{"_key":"2ef7b440cf5a","_type":"span","marks":["strong"],"text":"Governor Wes Moore, State of Maryland:"},{"_key":"b05a68a5d0bf","_type":"span","marks":[],"text":"\n\"This massive new project will deliver the largest private investment, drive billions of dollars in economic activity, and create the most jobs in Maryland in history. That means thousands of Marylanders will have a new pathway to work, wages, and wealth through advanced training and high-skilled maritime manufacturing jobs. We thank Anduril for choosing Maryland, and we're ready to build the future of our aerospace and defense economy together.\"\n\n"},{"_key":"154cc2ad3192","_type":"span","marks":["strong"],"text":"Lt. Governor Aruna Miller, State of Maryland:"},{"_key":"0658add2415a","_type":"span","marks":[],"text":"\n\"This new facility is a generational investment in Maryland's future, strengthening our position as a national leader in advanced manufacturing, aerospace, and defense. The project builds on our proud manufacturing legacy while bringing thousands of good-paying jobs to Sparrows Point. The Moore-Miller Administration is proud to partner with Anduril to ensure the technologies and vessels shaping America's future are built right here in Maryland.\"\n\n"},{"_key":"3976844282df","_type":"span","marks":["strong"],"text":"Comptroller Brooke E. Lierman, State of Maryland:"},{"_key":"b2708d2420ee","_type":"span","marks":[],"text":"\n\"Maryland has a skilled manufacturing workforce with a long tradition of shipbuilding that goes back centuries. I'm pleased to welcome Anduril to the Baltimore region and to Tradepoint Atlantic, a world-class facility and global hub for innovation. This commitment will create thousands of high-paying jobs for Marylanders. I invite others to join Anduril in investing in a region on the rise.\"\n\n"},{"_key":"6e9fc6ba4b97","_type":"span","marks":["strong"],"text":"Secretary Harry Coker, Jr., Maryland Department of Commerce:"},{"_key":"24c84779073c","_type":"span","marks":[],"text":"\n\"Anduril Industries' landmark investment confirms Maryland's status as a global leader in maritime defense manufacturing and a home to the industries of the future. We are thrilled to be working with Anduril to support this transformative project and bring thousands of new jobs to Maryland.\"\n"}],"markDefs":[],"style":"normal"},{"_key":"3afa477a9706","_type":"block","children":[{"_key":"3dcfe00c9f0d","_type":"span","marks":["strong"],"text":"Maryland General Assembly\nSpeaker Joseline Peña-Melnyk, Speaker of the Maryland House of Delegates:"},{"_key":"e705317f19cc","_type":"span","marks":[],"text":"\n\"Maryland has a proud history of building things, and we have the skilled workforce and infrastructure to help build what comes next. We welcome this investment by Anduril at Sparrows Point and the thousands of good-paying manufacturing jobs it will bring to our state. This is an exciting opportunity to build on the remarkable revitalization of Sparrows Point, strengthen Maryland's manufacturing economy, and create new opportunities for Maryland workers and families.\"\n\n"},{"_key":"64d759a8d95a","_type":"span","marks":["strong"],"text":"Delegate Ben Barnes, Chair, House Appropriations Committee:"},{"_key":"d2c65d502c2f","_type":"span","marks":[],"text":"\n\"For decades, Bethlehem Steel provided good paying jobs for families across Maryland. Today, Anduril's investment in Baltimore puts us back on the map for manufacturing and makes our economy even stronger for Maryland families.\"\n\n"},{"_key":"6c75985ea03d","_type":"span","marks":["strong"],"text":"Senator Guy Guzzone, Chair, Budget and Taxation Committee:"},{"_key":"173e508c041d","_type":"span","marks":[],"text":"\n\"I'm very pleased to welcome Anduril to Tradepoint Atlantic and look forward to working with them to put Baltimore back in the shipbuilding business. Manufacturing jobs are critical to Maryland's future, and Anduril's significant investment will make a big difference in leading the way forward.\"\n\n"},{"_key":"d75d770ae177","_type":"span","marks":["strong"],"text":"Delegate Bob Long, District 6:"},{"_key":"07039c311f0d","_type":"span","marks":[],"text":"\n\"Sparrows Point's proud history of helping protect our country is being recognized by the Trump Administration and Anduril Industries. Bringing manufacturing and good-paying jobs to our community and continuing that proud legacy.\"\n\n"},{"_key":"fe462f2ef986","_type":"span","marks":["strong"],"text":"Senator Johnny Ray Salling, District 6:"},{"_key":"efa86ea815cf","_type":"span","marks":[],"text":"\n\"I want to thank Our President Donald J. Trump and Anduril Industries for coming to Tradepoint Atlantic and being a part of a new opportunity in our community. Looking forward to being a part of history and working with Anduril on this exciting project.\"\n"}],"markDefs":[],"style":"normal"},{"_key":"0d12ab81d32f","_type":"block","children":[{"_key":"7e2d80b8290c","_type":"span","marks":["strong"],"text":"Baltimore County"}],"markDefs":[],"style":"normal"},{"_key":"10455e30d061","_type":"block","children":[{"_key":"7e2d80b8290c","_type":"span","marks":["strong"],"text":"County Executive Kathy Klausmeier, Baltimore County:"},{"_key":"509db9810c37","_type":"span","marks":[],"text":"\n\"Arsenal 2 marks a turning point for Sparrows Point. For generations, this site shaped America's steel and shipbuilding legacy, including its critical role during World War II, when workers here built the vessels that helped defend our nation. Seeing new life and advanced manufacturing return to this historic area is exciting for Baltimore County. This project will bring thousands of good jobs, new opportunities for local businesses, and billions in long-term economic value, strengthening our county for decades to come. It also reflects the significant progress at Tradepoint Atlantic, solidifying its status as a premier maritime hub and key partner in our region's economic future, building a stronger, more resilient foundation for the entire region.“\n\n"},{"_key":"a4975e127968","_type":"span","marks":["strong"],"text":"Council Chairman Mike Ertel, District 6:"},{"_key":"7c027c9f78d5","_type":"span","marks":[],"text":"\n\"For decades, Sparrows Point defined American industry, and Anduril's investment carries that legacy forward in a huge way. As we welcome Anduril to Baltimore County, we are thrilled to see the return of manufacturing and shipbuilding to this historic site. With thousands of new jobs and billions in economic investment on the way, this project represents a key milestone and transformative moment in Baltimore County's history.\"\n\n"},{"_key":"9b37535b6cc7","_type":"span","marks":["strong"],"text":"Councilman Pat Young, District 1:"},{"_key":"82873c115a79","_type":"span","marks":[],"text":"\n\"With thousands of manufacturing jobs on the way and a billion-dollar economic boost, this project represents extraordinary momentum for our region and a significant opportunity for our communities. This investment will help strengthen our industrial base and build a stronger, more resilient economic future.\"\n\n"},{"_key":"783bade470db","_type":"span","marks":["strong"],"text":"Councilman Julian Jones, District 4:"},{"_key":"1de73a61e2f9","_type":"span","marks":[],"text":"\n\"Sparrows Point has long been an economic engine for our region, and as the son of a factory worker who spent decades at the steel mill there, I know firsthand what those opportunities have meant to working families across Baltimore County. Anduril's multi-billion-dollar investment will have a transformative impact for this community, creating more than 3,000 new jobs and marking the historic return of shipbuilding to Sparrows Point. I welcome Anduril to our community and look forward to a close partnership that continues to drive economic growth across Baltimore County.\"\n\n"},{"_key":"58374e98c0cd","_type":"span","marks":["strong"],"text":"Councilman David Marks, District 5:"},{"_key":"980d50928f0b","_type":"span","marks":[],"text":"\n\"This is a historic announcement that keeps with Baltimore's tradition as a center for industry and shipbuilding.\"\n\n"},{"_key":"79431e7a1801","_type":"span","marks":["strong"],"text":"Councilman Todd Crandell, District 7:"},{"_key":"716b615e30af","_type":"span","marks":[],"text":"\n\"Over the last 10 years, Tradepoint Atlantic has led a transformative redevelopment of Sparrows Point, bringing nearly 20,000 jobs back to our community. With billions in economic investment and thousands of jobs, Anduril's investment will bring Sparrows Point's total employment to more than 23,000 workers, eclipsing the job totals last seen during the days of Bethlehem Steel. This resurgence is a testament to the incredible strength and resilience of our community and our heritage in industry.\"\n"}],"markDefs":[],"style":"normal"},{"_key":"bf05528402a2","_type":"block","children":[{"_key":"8e2f014d4508","_type":"span","marks":["strong"],"text":"Industry & Commerce"}],"markDefs":[],"style":"normal"},{"_key":"f2ce197f6cdf","_type":"block","children":[{"_key":"d39767b023c7","_type":"span","marks":["strong"],"text":"Kerry Doyle, Managing Director, Tradepoint Atlantic:"},{"_key":"fdf60de08f06","_type":"span","marks":[],"text":"\n\"Today's announcement is about more than welcoming a new tenant—it's about restoring one of America's most important industrial assets to its historic purpose. For generations, Sparrows Point helped build the ships that defended our nation. Today, that legacy continues as Anduril reactivates this iconic shipyard to support the next generation of American defense capabilities. Tradepoint Atlantic is uniquely built for this mission. Our strategic East Coast location, deep-water port, robust rail and interstate connections, and access to a world-class workforce make this one of the most capable industrial sites in the country. Together with Anduril, we're bringing a legacy industry back to Baltimore, creating thousands of skilled jobs, and helping strengthen America's defense industrial base for decades to come.“"}],"markDefs":[],"style":"normal"}],"fullBleed":false,"hideSlice":false,"paragraphWidth":"w-100"}],"slug":{"_type":"slug","current":"anduril-u-s-navy-invest-usd6-6-billion-to-expand-america-s-submarine-industrial-base"},"title":"Anduril, U.S. Navy Invest $6.6 Billion to Expand America's Submarine Industrial Base","viewType":"main"}},"showThumbnail":false},{"_key":"7421e4647b68","_type":"mediaLinkSlice","cards":[{"_key":"57a5d3c0a644","_type":"mediaLinkCard","color":{"_createdAt":"2025-03-28T19:57:45Z","_id":"312278d0-9291-4102-932f-2fbe38d107f5","_rev":"x8r7rwnZNJLuzU8uziaQjt","_system":{"base":{"id":"312278d0-9291-4102-932f-2fbe38d107f5","rev":"3h6Aq9HwJKloB0447GtDIQ"}},"_type":"color","_updatedAt":"2025-06-18T01:03:01Z","contrastColor":"#FFFFFF","hex":"#505544","metadata":null,"name":"Green"},"cta":[{"_key":"58a12ec6d617","_type":"internalLink","reference":{"_id":"80da306c-8db6-459b-a6ab-7886f484aee7","_type":"page","language":null,"parent":null,"slug":{"_type":"slug","current":"rebooting-the-arsenal"},"title":"Rebooting the Arsenal"},"targetBlank":false,"text":"Read More"}],"image":{"_type":"imageWithMeta","asset":{"_id":"image-dddfeebfe9d2f943790ffdbbf2bdbcca1efe6a0d-3840x2160-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7777777777777777,"height":2160,"width":3840},"hasAlpha":true,"isOpaque":true}}},"label":"PT — \n01 / 02","title":"Rebooting\nThe Arsenal"},{"_key":"f958cf641d83","_type":"mediaLinkCard","color":{"_createdAt":"2025-03-28T19:59:10Z","_id":"06a5beb4-22c7-4d8c-97f1-2776c1f020e8","_rev":"s4FbY1rNJZOqUnJhlMyiRj","_type":"color","_updatedAt":"2025-06-18T01:02:36Z","contrastColor":"#010101","hex":"#8E9291","metadata":null,"name":"Mid Gray"},"cta":[{"_key":"31180e5151b4","_type":"internalLink","reference":{"_id":"449e16c3-e512-4532-8981-477835429a02","_type":"page","language":null,"parent":null,"slug":{"_type":"slug","current":"rebuild-the-arsenal"},"title":"Rebuild the Arsenal"},"targetBlank":false,"text":"Read More"}],"image":{"_type":"imageWithMeta","asset":{"_id":"image-a3ee20317f076eb30c952e3ac7ab05308f55d6dd-3840x2160-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7777777777777777,"height":2160,"width":3840},"hasAlpha":true,"isOpaque":true}}},"label":"PT — \n02 / 02","title":"Rebuild\nThe Arsenal"}]}],"slug":{"_type":"slug","current":"home"},"title":"Home","path":""}
