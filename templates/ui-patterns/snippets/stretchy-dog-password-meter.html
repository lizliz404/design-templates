<!doctype html>
<!-- Minimal demo of the stretchy-dog password meter. Doc: ../stretchy-dog-password-meter.md
     Original idea: Ramin Nasibov, https://x.com/RaminNasibov/status/2111194691303596460 -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stretchy dog password meter</title>
<style>
  :root{--ink:#111;--mute:#6b6b6b;--bad:#d93025;--good:#188038;--dog:#b8743c;--dog-dark:#7a4a22}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f2ee;font:15px/1.5 system-ui,sans-serif;color:var(--ink)}
  .card{background:#fff;border-radius:20px;padding:32px;width:min(560px,92vw);box-shadow:0 10px 40px #0000000f}
  h1{margin:0;font-size:22px} .sub{margin:4px 0 24px;color:var(--mute)}
  .field{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .dog{height:64px;display:flex;align-items:flex-end;transition:width .16s ease-out}
  .dog svg{display:block;height:64px}
  .body{flex:1;height:30px;background:var(--dog);border-radius:15px;margin:0 -10px 6px -10px;position:relative}
  .body::after{content:"";position:absolute;left:12%;right:12%;bottom:-14px;height:14px;
    background:radial-gradient(circle at 8px 0,var(--dog-dark) 6px,transparent 7px) 0 0/calc(100% - 16px) 14px no-repeat,
               radial-gradient(circle at calc(100% - 8px) 0,var(--dog-dark) 6px,transparent 7px) 0 0/100% 14px no-repeat}
  input{font:16px ui-monospace,monospace;padding:12px 14px;border:1.5px solid #d6d3cd;border-radius:12px;
        min-width:12ch;max-width:100%;transition:width .16s ease-out;outline:none}
  input:focus{border-color:var(--ink)}
  .hint{font-size:13px;min-height:20px;color:var(--bad)} .hint.ok{color:var(--good)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:20px}
  button{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  a{color:var(--mute)}
  @media (prefers-reduced-motion: reduce){.dog,input{transition:none}}
</style>
</head>
<body>
<form class="card" onsubmit="event.preventDefault()">
  <h1>Reset password</h1>
  <p class="sub">Make it long, you weakling</p>
  <div class="field">
    <div class="dog" id="dog" aria-hidden="true">
      <svg viewBox="0 0 48 64" width="48"><path d="M8 52 Q2 40 14 40 L40 40 Q48 52 40 56 L14 56Z" fill="var(--dog)"/><path d="M10 44 Q0 36 6 30" stroke="var(--dog-dark)" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      <div class="body"></div>
      <svg viewBox="0 0 80 64" width="80" id="head"></svg>
    </div>
    <label for="pw" class="sub" style="margin:0">New password</label>
    <input id="pw" type="password" autocomplete="new-password" aria-describedby="hint">
    <div class="hint" id="hint" aria-live="polite">Password strength: pathetic</div>
  </div>
  <div class="actions"><button type="submit">Reset</button><a href="#">Cancel</a></div>
</form>
<script>
const pw = document.getElementById('pw'), dog = document.getElementById('dog'), hint = document.getElementById('hint'), head = document.getElementById('head');
// thresholds: [minLength, copy, good?, face]
const LEVELS = [[0,'pathetic',0,'grumpy'],[6,'still weak',0,'surprised'],[10,'ok for a noob',0,'smile'],
                [14,'not bad, weakling',0,'smug'],[18,'damn, solid',1,'smug'],[22,'finally good enough',1,'happy']];
const MOUTH = {grumpy:'M48 46 Q54 42 60 46', surprised:'M54 46 a3 3 0 1 0 0.1 0', smile:'M48 44 Q54 50 60 44',
               smug:'M48 45 Q56 48 62 42', happy:'M48 44 Q54 52 60 44 M53 47 q2 8 5 0'};
function face(m){
  head.innerHTML = `<path d="M6 30 Q10 10 40 12 Q70 14 74 38 Q74 54 52 56 L10 56 Q4 44 6 30Z" fill="var(--dog)"/>
    <path d="M26 14 Q14 18 18 40 Q28 36 30 16Z" fill="var(--dog-dark)"/>
    <circle cx="44" cy="30" r="3.5" fill="#111"/>${m==='grumpy'?'<path d="M38 22 L50 25" stroke="#111" stroke-width="2.5"/>':''}
    <circle cx="72" cy="38" r="5" fill="#111"/>
    <path d="${MOUTH[m]}" stroke="#111" stroke-width="2.5" fill="${m==='happy'?'#e86a7a':'none'}" stroke-linecap="round"/>`;
}
let lastLevel = -1;
function update(){
  const n = pw.value.length;
  pw.style.width = `calc(${Math.max(12, n + 2)}ch + 30px)`;
  dog.style.width = pw.getBoundingClientRect().width + 'px';   // body = exact input width
  const i = LEVELS.reduce((k, l, j) => n >= l[0] ? j : k, 0);
  if (i !== lastLevel) {                                         // only announce on level change
    const [, copy, good, m] = LEVELS[i];
    hint.textContent = `Password strength: ${copy}`; hint.classList.toggle('ok', !!good); face(m); lastLevel = i;
  }
}
pw.addEventListener('input', update); new ResizeObserver(update).observe(pw); update();
</script>
</body>
</html>
