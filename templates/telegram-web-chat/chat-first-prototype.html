<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出海云 · Chat-first 框架原型</title>
<style>
:root{color-scheme:light;--paper:oklch(.96 .016 85);--surface:oklch(.985 .01 85 / 94%);--ink:oklch(.28 .022 60);--soft:oklch(.48 .03 60);--line:oklch(.4 .06 70 / 14%);--sea:oklch(.52 .2 262);--wash:oklch(.52 .2 262 / 8%)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent;border-radius:999px}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--sea);outline-offset:3px}button:hover{background:var(--wash)}button:disabled{cursor:default;opacity:.4}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button svg{display:block}button[hidden],[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:180px minmax(0,1fr);overflow:hidden;background:radial-gradient(ellipse at 85% 0%,rgba(64,88,234,.035),transparent 60%)}.sidebar{border-right:1px solid var(--line);padding:22px 14px;background:rgba(249,245,236,.48)}.brand{display:flex;align-items:center;gap:9px;color:var(--sea);font-weight:600;margin:0 8px 36px}.brand svg{background:var(--sea);color:#f9f6f1;border-radius:10px;padding:6px;box-sizing:content-box}.nav{display:grid;gap:8px}.nav span{padding:9px 14px;color:var(--soft)}.nav .selected{color:var(--sea);background:var(--wash);border-radius:999px;font-weight:500}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.header{flex:none;height:68px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.header-title{display:flex;align-items:center;gap:10px;font-weight:500}.scope{color:var(--soft);font-size:12px;background:rgba(125,91,64,.06);padding:3px 10px;border-radius:999px}.header-actions{display:flex;gap:8px}.header-actions button{width:40px;height:40px;display:grid;place-items:center}.prototype{background:var(--wash);color:var(--sea);font-size:11px;padding:2px 8px;border-radius:999px}.chat{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.thread-inner{max-width:800px;margin:auto;padding:32px 26px 28px;display:grid;gap:28px}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - 330px);text-align:center;padding:40px 8px}.empty h1{font-size:24px;line-height:1.3;font-weight:500;margin:22px 0 8px}.empty p{color:var(--soft);margin:0 0 25px;font-size:14px}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.suggestions button{padding:8px 15px;border:1px solid var(--line);background:var(--surface);font-size:13px}.orb{display:block;flex:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(ellipse at 65% 20%,#acc2ff 0%,#536aed 30%,#354bb9 54%,#ced9ff 73%,#667bf1 90%);box-shadow:inset 2px -2px 5px #f6f1e870;position:relative}.orb.large{width:64px;height:64px}.user{justify-self:end;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--wash);border:1px solid rgba(64,88,234,.08);border-radius:20px 20px 6px 20px;padding:12px 17px}.assistant{display:flex;gap:14px;min-width:0}.assistant .content{flex:1;min-width:0}.assistant .orb{margin-top:3px}.content p{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}.message-actions{display:flex;gap:4px;align-items:center;color:var(--soft);font-size:12px}.message-actions button{display:grid;place-items:center;width:32px;height:32px}.message-actions svg{width:15px;height:15px}.activity{color:var(--soft);font-size:13px}.activity summary{cursor:pointer}.activity p{margin-top:8px;font-size:12px}.proposal{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;margin-top:14px}.proposal h2{font-weight:500;font-size:15px;margin:0 0 8px}.proposal .spec{color:var(--soft);font-size:13px}.proposal details{border-top:1px solid var(--line);padding-top:10px;margin-top:14px;font-size:13px;color:var(--soft)}.proposal summary{cursor:pointer}.proposal footer{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}.primary{background:var(--sea)!important;color:#f9f6f1!important;padding:8px 18px}.quiet{border:1px solid var(--line);padding:8px 16px}.error{border-left:2px solid #d94b3a;padding:4px 0 4px 14px}.error p{margin-bottom:8px}.jump{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 14px #31261e10;width:38px;height:38px;display:grid;place-items:center}
.dock{flex:none;width:100%;padding:8px 24px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 22%)}.dock-inner{max-width:748px;margin:auto}.context{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:12px;margin:0 5px 9px}.context button{padding:2px 8px}.context .tag{border:1px solid var(--line);border-radius:999px;padding:3px 9px;display:flex;gap:8px;align-items:center;background:var(--surface)}.composer{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:13px 13px 10px;box-shadow:0 2px 9px #31261e05}.composer:focus-within{border-color:#4058ea55}.composer textarea{display:block;width:100%;border:0;outline:none!important;resize:none;min-height:28px;max-height:140px;line-height:1.65;background:transparent;padding:0 4px;font-size:15px}.composer textarea::placeholder{color:#6b5a4d88}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}.toolbar-left{display:flex;gap:5px;align-items:center}.icon{display:grid;place-items:center;width:36px;height:36px}.toolbar .settings{font-size:12px;color:var(--soft);padding:7px 10px}.send{width:36px;height:36px;display:grid;place-items:center;background:var(--sea);color:#f9f6f1}.send:disabled{background:rgba(125,91,64,.1);color:var(--soft);opacity:1}.footnote{font-size:11px;text-align:center;color:var(--soft);margin:7px 0 0;opacity:.8}.no-scope .scope,.no-scope .settings,.no-scope .context{display:none}.preview-controls{font-size:11px;color:var(--soft);display:flex;gap:8px;align-items:center}.preview-controls button{white-space:nowrap;padding:5px}.preview-controls select{border:0;background:transparent;font-size:11px;max-width:100px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:24px;width:min(420px,calc(100% - 30px));max-height:85dvh}dialog::backdrop{background:#31261e35}dialog h2{font-size:17px;font-weight:500;margin:0 0 18px}.dialog-head{display:flex;align-items:center;justify-content:space-between}.fields{display:grid;gap:15px}.fields label{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px}.fields input,.fields select{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:7px 10px;width:150px}.fields input{width:90px}dialog small{display:block;color:var(--soft);margin-top:16px}.dialog-footer{display:flex;justify-content:flex-end;margin-top:20px}.history-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.header{height:58px;padding:8px 16px}.header-title{gap:7px}.scope{font-size:11px}.header-actions{gap:0}.header-actions button{width:36px;height:36px}.thread-inner{padding:25px 16px;gap:24px}.dock{padding:8px 12px max(12px,env(safe-area-inset-bottom))}.empty{min-height:calc(100dvh - 310px);padding:28px 6px}.empty h1{font-size:22px}.suggestions{flex-direction:column}.assistant{gap:10px}.assistant .orb{width:24px;height:24px}.prototype{display:none}.user{max-width:92%}.preview-controls label{display:none}}
@media(prefers-reduced-motion:no-preference){.assistant,.user{animation:appear 150ms ease-out}@keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar"><div class="brand"><svg viewBox="0 0 24 24"><path d="M12 3v13M12 3l8 13H4L12 3M4 20h16"/></svg>出海云</div><nav class="nav"><span>工作台</span><span>素材</span><span>拍摄</span><span class="selected">创作</span><span>发布</span><span>收件箱</span></nav></aside>
<main class="main">
<header class="header"><div class="header-title"><span>Agent</span><span class="scope">混剪</span><span class="prototype">交互原型 · 无后台</span></div><div class="header-actions"><button id="history" title="最近任务" aria-label="最近任务"><svg viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/></svg></button><button id="new" title="新会话" aria-label="新会话"><svg viewBox="0 0 24 24"><path d="M12 5H5v14h14v-7M16 3l5 5-9 9-5 1 1-5 8-10"/></svg></button><div class="preview-controls"><label for="scene">演示状态</label><select id="scene" aria-label="演示状态"><option value="empty">空态</option><option value="answer">答复</option><option value="proposal">提案</option><option value="error">故障</option></select><button id="scope-toggle" title="仅切换通用壳预览，不代表全局能力" aria-label="通用壳预览">通用壳</button></div></div></header>
<section class="chat" aria-label="Agent 对话"><div class="thread" id="thread" role="log" aria-label="消息"><div class="thread-inner" id="messages"></div></div><button id="jump" class="jump" hidden aria-label="回到最新消息"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
<div class="dock"><div class="dock-inner"><div class="context" id="context" hidden><span class="tag">视频 × 3 <button aria-label="移除演示附件" id="remove">×</button></span><span>作为本次上下文</span></div><form id="form" class="composer"><textarea id="input" rows="1" placeholder="发消息，或先添加素材…" aria-label="消息输入"></textarea><div class="toolbar"><div class="toolbar-left"><button type="button" id="attach" class="icon" title="添加素材" aria-label="添加素材"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" id="settings" class="settings" aria-haspopup="dialog">混剪设置 ⌄</button></div><button type="submit" id="send" class="send" aria-label="发送" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form><p class="footnote" id="hint">原型仅演示布局；不上传、不调用模型、不创建任务。</p></div></div>
</section></main></div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">混剪设置</h2><button data-close aria-label="关闭设置">×</button></div><div class="fields"><label>条数 <input type="number" value="3" min="1" max="20"></label><label>时长 <select><option>15 秒</option><option>30 秒</option></select></label><label>画幅 <select><option>9:16</option><option>16:9</option></select></label><label>语言 <select><option>中文</option><option>English</option></select></label><label>声音 <select><option>保留现场声音</option><option>AI 配音</option></select></label></div><small>本原型不保存设置。正式版复用既有 spec，同一份设置进入 Agent 确认。</small><div class="dialog-footer"><button class="primary" data-close>完成</button></div></dialog>
<dialog id="attach-dialog" aria-labelledby="attach-title"><div class="dialog-head"><h2 id="attach-title">添加素材</h2><button data-close aria-label="关闭附件">×</button></div><p>正式版接现有上传队列和素材库，不新增文件系统。</p><button class="quiet" id="pick">选择 3 条演示视频</button><small>演示上下文，无真实文件读取或上传。</small></dialog>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-head"><h2 id="history-title">最近任务</h2><button data-close aria-label="关闭历史">×</button></div><div class="history-item">产品近景 · 演示任务 · 待核对</div><small>正式版复用现有任务历史；任务历史不冒充聊天历史。</small></dialog>
<script>
const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let busy=false,atBottom=true;
const copyIcon='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>';
function assistant(content){return '<div class="assistant"><span class="orb" aria-hidden="true"></span><div class="content">'+content+'</div></div>'}
function actions(text){return '<div class="message-actions"><button data-copy="'+esc(text)+'" aria-label="复制消息">'+copyIcon+'</button></div>'}
function user(text){return '<div class="user">'+esc(text)+'</div>'}
const exampleGoal='用这次拍的产品素材，做 3 条 15 秒短片。';
function proposal(){return assistant('<p>建议以产品近景和动作片段为主，先做 3 条可审样片。</p><div class="proposal"><h2>确认这份创作方案</h2><div class="spec">3 条 · 15 秒 · 9:16 · 中文</div><details><summary>素材与文案详情</summary><p>演示素材：3 条视频。使用可剪片段，保留现场声音；不补编产品功效。</p></details><footer><button class="quiet" id="edit-plan">继续聊聊</button><button class="primary" id="confirm-plan">确认并开始</button></footer></div>')}
function render(scene){busy=false;const m=$('messages');if(scene==='empty')m.innerHTML='<div class="empty"><span class="orb large" aria-hidden="true"></span><h1>今天想做点什么？</h1><p>说说你的目标，素材和设置可以随后补充。</p><div class="suggestions"><button data-suggestion="用这次拍的素材做 3 条短片">用这次拍的素材做短片</button><button data-suggestion="帮我看看这些素材怎么剪">帮我看看素材怎么剪</button><button data-suggestion="解释一下刚才任务的报错">解释刚才的报错</button></div></div>';
else if(scene==='answer')m.innerHTML=user('这条视频没按原稿拍，还能用吗？')+assistant('<details class="activity"><summary>查看已读信息 · 演示</summary><p>仅为示例，未读取真实素材。</p></details><p>可以。没有照原稿拍，不代表素材不可用。\n\n先看它实际包含的画面和声音，再选择适合这次创作的片段。你可以把素材加到本次上下文，我再帮你判断。</p>'+actions('没有照原稿拍，不代表素材不可用。'));
else if(scene==='proposal'){m.innerHTML=user(exampleGoal)+proposal();$('context').hidden=false;}
else m.innerHTML=user(exampleGoal)+assistant('<div class="error"><p>暂时没能确认服务端状态。消息保留在这里，不要重复创建任务。</p><button class="quiet" id="retry">核对状态（演示）</button></div>');updateInput();jump(true)}
function jump(force=false){if(atBottom||force)$('thread').scrollTop=$('thread').scrollHeight;}
function updateInput(){const el=$('input');el.style.height='auto';el.style.height=Math.min(140,el.scrollHeight)+'px';$('send').disabled=!busy&&!el.value.trim();$('send').setAttribute('aria-label',busy?'停止演示':'发送');$('send').innerHTML=busy?'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';}
$('input').addEventListener('input',updateInput);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('form').requestSubmit()}});
$('form').addEventListener('submit',e=>{e.preventDefault();if(busy){busy=false;$('pending')?.remove();$('messages').insertAdjacentHTML('beforeend',assistant('<p>已停止演示。本原型没有后台任务。</p>'));updateInput();jump();return}const text=$('input').value.trim();if(!text)return;if($('messages').querySelector('.empty'))$('messages').innerHTML='';$('messages').insertAdjacentHTML('beforeend',user(text)+assistant('<div id="pending"><p class="activity">演示等待态 · 不代表真实 Agent 正在执行</p><button class="quiet" id="demo-reply">显示演示答复</button></div>'));$('input').value='';busy=true;updateInput();jump(true)});
$('scene').addEventListener('change',()=>render($('scene').value));$('new').onclick=()=>{render('empty');$('scene').value='empty';$('input').value='';$('context').hidden=true;updateInput();$('input').focus()};$('settings').onclick=()=>$('settings-dialog').showModal();$('attach').onclick=()=>$('attach-dialog').showModal();$('history').onclick=()=>$('history-dialog').showModal();$('pick').onclick=()=>{$('context').hidden=false;$('attach-dialog').close()};$('remove').onclick=()=>$('context').hidden=true;$('scope-toggle').onclick=()=>$('app').classList.toggle('no-scope');$('jump').onclick=()=>jump(true);
$('thread').addEventListener('scroll',()=>{atBottom=$('thread').scrollHeight-$('thread').scrollTop-$('thread').clientHeight<60;$('jump').hidden=atBottom});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))b.closest('dialog').close();if(b.dataset.suggestion){$('input').value=b.dataset.suggestion;updateInput();$('input').focus()}if(b.dataset.copy){navigator.clipboard?.writeText(b.dataset.copy).then(()=>b.setAttribute('aria-label','已复制')).catch(()=>{})}if(b.id==='demo-reply'){busy=false;$('pending')?.remove();$('messages').insertAdjacentHTML('beforeend',assistant('<p>这是演示答复，用于核对连续聊天的布局。真实版复用既有 Journey 数据，不照抄演示内容。</p>'));updateInput();jump()}if(b.id==='edit-plan'){$('input').value='我想调整这个方案：';updateInput();$('input').focus()}if(b.id==='confirm-plan'){$('messages').insertAdjacentHTML('beforeend',assistant('<p>这里显示真实任务状态和产物；演示不会创建任务。</p>'));b.disabled=true;jump()}if(b.id==='retry')b.textContent='演示未接后台，请查看故障布局';});
render(new URLSearchParams(location.search).get('scene')||'empty');
</script>
</body></html>
